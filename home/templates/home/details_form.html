{% extends 'home/base.html' %}

{% block title %}{{ page_title }} | Vijana Connect{% endblock %}

{% block content %}
<section class="page-section">
    <div class="auth-wrapper">
        <div class="info-card">
            <h4>{{ heading }}</h4>
            <p class="meta">{{ subheading }}</p>

            <form class="contact-form" method="post">
                {% csrf_token %}
                {% for field in form %}
                    <label>{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <small class="field-error">{{ error }}</small>
                    {% endfor %}
                {% endfor %}
                <button type="submit" class="apply-btn">{{ button_text }}</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}

<div class="job-item p-4 mb-4">
    <div class="row g-4">
        <div class="col-sm-12 col-md-8 d-flex align-items-center">
            <div class="flex-shrink-0 border rounded bg-light d-flex align-items-center justify-content-center" style="width: 80px; height: 80px;">
                <i class="fa fa-2x text-primary {% if opp.category == 'job' %}fa-briefcase{% elif opp.category == 'vacancy' %}fa-bullhorn{% else %}fa-graduation-cap{% endif %}"></i>
            </div>
            <div class="text-start ps-4">
                <h5 class="mb-1">{{ opp.title }}</h5>
                <p class="mb-2 text-primary fw-medium">{{ opp.company }}</p>
                <span class="text-truncate me-3"><i class="fa fa-map-marker-alt text-primary me-2"></i>{{ opp.location }}</span>
                <span class="text-truncate me-3"><i class="far fa-clock text-primary me-2"></i>{{ opp.job_type }}</span>
                <span class="text-truncate me-0"><i class="fa fa-tag text-primary me-2"></i>{{ opp.get_category_display }}</span>
            </div>
        </div>
        <div class="col-sm-12 col-md-4 d-flex flex-column align-items-start align-items-md-end justify-content-center">
            <div class="d-flex mb-3">
                <a class="btn btn-primary" href="{% url 'apply' opp.id %}">Apply Now</a>
            </div>
            <small class="text-truncate"><i class="far fa-calendar-alt text-primary me-2"></i>Deadline: {{ opp.deadline|date:"j M Y" }}</small>
        </div>
    </div>
</div>
